<!DOCTYPE html>
<html>
<head>
    <title>My OS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="os">
        
        <div id="topbar">
            <div id="time">00:00:00</div>
            <div id="weather">☀️ 22°C</div>
        </div>
    
        <div id="music-status" style="margin-top:10px; color:#888;">Enter a URL and press Play</div>
        <div id="search-container">
            <input type="text" id="search" placeholder="Search...">
            <button onclick="search()">Go</button>
        </div>

        <div id="apps">
            <div class="app" onclick="openWindow('notes')">📝 Notes</div>
            <div class="app" onclick="openWindow('calc')">🧮 Calc</div>
            <div class="app" onclick="openWindow('timer')">⏱️ Timer</div>
            <div class="app" onclick="openWindow('todo')">✅ Todo</div>
            <div class="app" onclick="openWindow('pong')">🏓 Pong</div>
            <div class="app" onclick="openWindow('about')">ℹ️ About</div>
            <div class="app" onclick="openWindow('music')">🎵 Music</div>
            <div class="app" onclick="openWindow('settings')">⚙️ Settings</div>
        </div>
        <div id="app-content">
            <p style="color:#444; text-align:center; padding:30px 0; font-size:0.9rem;">Click an app to open it</p>
        </div>
        <div id="quote" style="color: #555; text-align:center; margin-bottom:20px; font-size:0.9rem;">Loading Quote...</div>    

    </div>

    <div id="window-container"></div>

    <script src="script.js"></script>

</body>
</html>
